<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taploan Secure Payment</title>

<style>
body {
  font-family: Arial;
  background: #020617;
  color: white;
  text-align: center;
}

.container {
  margin-top: 100px;
}

button {
  padding: 15px 25px;
  background: #22c55e;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #1e293b;
  padding: 25px;
  border-radius: 10px;
  width: 90%;
  max-width: 400px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">
  <h2>Taploan Repayment</h2>
  <button onclick="startPayment()">Pay Now</button>
</div>

<div id="paymentModal" class="modal">
  <div class="modal-content">
    <h3 id="status">🔄 Initializing secure payment...</h3>

    <div id="paymentDetails" class="hidden">
      <p>Send payment via Mobile Money:</p>
      <h3>📱 0505210056</h3>
      <p>Enter Transaction ID after payment</p>

      <input type="text" id="txid" placeholder="Transaction ID">
      <button onclick="confirmPayment()">Confirm Payment</button>
    </div>
  </div>
</div>

<script>
function startPayment() {
  document.getElementById("paymentModal").style.display = "flex";

  setTimeout(() => {
    document.getElementById("status").innerText = "✅ Ready for payment";
    document.getElementById("paymentDetails").classList.remove("hidden");
  }, 2000);
}

function confirmPayment() {
  alert("Payment submitted for verification!");
}
</script>

</body>
</html>
