<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Impact', sans-serif; }
  .container {
    width: 100%; height: 100%;
    background: linear-gradient(160deg, #000 40%, #1a1a2e 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .police-banner {
    width: 100%;
    background: repeating-linear-gradient(90deg, #FFD700 0px, #FFD700 80px, #000 80px, #000 160px);
    height: 40px;
    border-bottom: 6px solid #CC0000;
  }
  .badge {
    font-size: 22px;
    color: #FFD700;
    letter-spacing: 4px;
    margin-top: 20px;
    text-align: center;
    text-shadow: 2px 2px 8px #000;
    font-family: Arial, sans-serif;
    font-weight: bold;
  }
  .photo-wrap {
    margin-top: 30px;
    width: 800px;
    height: 980px;
    border: 8px solid #FFD700;
    box-shadow: 0 0 60px #FFD700aa, 0 0 120px #CC000055;
    overflow: hidden;
    position: relative;
  }
  .photo-wrap img {
    width: 100%; height: 100%; object-fit: cover; object-position: top;
    filter: contrast(1.1) saturate(1.2);
  }
  .overlay-red {
    position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
    background: linear-gradient(transparent, rgba(180,0,0,0.85));
  }
  .title {
    margin-top: 40px;
    text-align: center;
    padding: 0 40px;
    line-height: 1.1;
  }
  .title span.main {
    display: block;
    font-size: 130px;
    color: #FFD700;
    text-shadow: -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000, 0 8px 20px #CC0000;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .title span.sub {
    display: block;
    font-size: 90px;
    color: #fff;
    text-shadow: -3px -3px 0 #CC0000, 3px -3px 0 #CC0000, -3px 3px 0 #CC0000, 3px 3px 0 #CC0000;
    margin-top: 10px;
    text-transform: uppercase;
  }
  .police-banner-bottom {
    width: 100%;
    background: repeating-linear-gradient(90deg, #CC0000 0px, #CC0000 80px, #000 80px, #000 160px);
    height: 40px;
    margin-top: auto;
    border-top: 6px solid #FFD700;
  }
  .sirens {
    display: flex; justify-content: space-around; width: 100%; padding: 20px 60px 0;
  }
  .siren { font-size: 60px; }
</style>
</head>
<body>
<div class="container">
  <div class="police-banner"></div>
  <div class="badge">🚔 GHANA POLICE SERVICE 🚔</div>
  <div class="photo-wrap">
    <img src="/mnt/user-data/uploads/img.jpeg" alt="Mahama">
    <div class="overlay-red"></div>
  </div>
  <div class="sirens">
    <span class="siren">🚨</span>
    <span class="siren">🚨</span>
    <span class="siren">🚨</span>
  </div>
  <div class="title">
    <span class="main">MAHAMA!</span>
    <span class="sub">Wo De Yɛnka</span>
  </div>
  <div class="police-banner-bottom"></div>
</div>
</body>
</html>
